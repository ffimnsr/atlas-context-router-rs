[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Unmaintained, no safe upgrade; transitive pins tracked for upstream bumps:
    # instant via notify-types -> notify (atlas-engine)
    "RUSTSEC-2024-0384",
    # Unrelated pre-existing advisories; upstream/tracked separately from the
    # tokenizer work:
    # chrono unmaintained via rmcp's transitive dependencies
    "RUSTSEC-2026-0543",
    # bundled SQLite < 3.54 via rusqlite 0.32; requires a rusqlite 0.41 major
    # bump that is tracked separately from the tokenizer change
    "RUSTSEC-2026-0459",
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    # foldhash 0.2 via hashbrown (rmcp/jsonschema graph)
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
