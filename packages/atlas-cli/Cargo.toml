[package]
name = "atlas-cli"
version = "1.7.6"
license.workspace = true
edition = "2024"
description = "Command-line interface for building, updating, and querying Atlas code graphs"

[features]
default = []
http-transport = ["atlas-mcp/http-transport"]

[[bin]]
name = "atlas"
path = "src/main.rs"

[dependencies]
atlas-core.workspace = true
atlas-adapters = { path = "../atlas-adapters" , version = "1.7.6"}
atlas-agent-events = { path = "../atlas-agent-events" , version = "1.7.6"}
atlas-contentstore = { path = "../atlas-contentstore" , version = "1.7.6"}
atlas-docs = { path = "../atlas-docs", version = "1.7.6" }
atlas-engine.workspace = true
atlas-history = { path = "../atlas-history", version = "1.7.6" }
atlas-impact = { path = "../atlas-impact" , version = "1.7.6"}
atlas-mcp.workspace = true
atlas-parser = { path = "../atlas-parser" , version = "1.7.6"}
atlas-reasoning = { path = "../atlas-reasoning" , version = "1.7.6"}
atlas-refactor = { path = "../atlas-refactor" , version = "1.7.6"}
atlas-repo = { path = "../atlas-repo" , version = "1.7.6"}
atlas-search = { path = "../atlas-search" , version = "1.7.6"}
atlas-review = { path = "../atlas-review" , version = "1.7.6"}
atlas-session = { path = "../atlas-session" , version = "1.7.6"}
atlas-store-sqlite = { path = "../atlas-store-sqlite" , version = "1.7.6"}
atlas-token-count.workspace = true
anyhow.workspace = true
camino.workspace = true
clap.workspace = true
clap_complete.workspace = true
console = "0.16"
dialoguer = "0.12"
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
time = { workspace = true, features = ["parsing", "macros", "formatting"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
fs2 = "0.4"
indicatif = "0.18"
libc = "0.2"
signal-hook = "0.4"
sha2.workspace = true

[dev-dependencies]
jsonschema = { version = "0.58", default-features = false }
rusqlite.workspace = true
tempfile = "3"

[build-dependencies]
time = { workspace = true, features = ["formatting"] }

[lints]
workspace = true
